#cloud-config
package_update: true
packages: [curl, git, jq, make]
write_files:
  - path: /etc/sysctl.d/90-resilience-lab.conf
    content: |
      net.ipv4.ip_forward=1
      vm.swappiness=0
  - path: /etc/rancher/k3s/config.yaml
    content: |
      write-kubeconfig-mode: "0600"
      secrets-encryption: true
      kube-apiserver-arg:
        - "service-node-port-range=30000-32767"
  - path: /etc/rancher/k3s/server/manifests/traefik-config.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          additionalArguments:
            - "--certificatesresolvers.lab.acme.email=admin@example.invalid"
            - "--certificatesresolvers.lab.acme.storage=/data/acme.json"
            - "--certificatesresolvers.lab.acme.httpchallenge.entrypoint=web"
          persistence:
            enabled: true
            size: 1Gi
          ports:
            web:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
runcmd:
  - swapoff -a
  - sysctl --system
  - curl -sfL https://get.k3s.io -o /root/install-k3s.sh
  - [sh, -c, 'INSTALL_K3S_VERSION=v1.33.5+k3s1 sh /root/install-k3s.sh']
  - git clone https://github.com/yehia249/Resilience-Lab.git /opt/resilience-lab
  - [sh, -c, 'echo "Cluster bootstrapped. Deploy reviewed image digests and create secrets using scripts/deploy.sh." > /opt/resilience-lab/BOOTSTRAP_STATUS.txt']
