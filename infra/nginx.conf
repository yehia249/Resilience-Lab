server {
  listen 8088;
  root /usr/share/nginx/html;
  access_log off;
  error_log /dev/null crit;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
  location /api/ { set $backend http://gateway:8080; proxy_pass $backend; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
  location /v1/ { set $telemetry http://telemetry-api:8095; proxy_pass $telemetry; proxy_buffering off; proxy_read_timeout 3600s; }
  location / { try_files $uri $uri/ /index.html; }
}
