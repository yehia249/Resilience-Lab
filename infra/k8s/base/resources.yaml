apiVersion: v1
kind: Namespace
metadata:
  name: lab
  labels:
    kubernetes.io/metadata.name: lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-payment
  labels:
    kubernetes.io/metadata.name: lab-payment
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-config
  namespace: lab
data:
  REDIS_URL: redis://redis.lab.svc.cluster.local:6379
  SITE_ORIGIN: https://REPLACE_HOST
  CHAOS_ENABLED: "true"
  CHAOS_ADAPTER: kubernetes
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lab.svc.cluster.local:4318
  POD_KILL_PROXY_URL: http://pod-kill-proxy.lab-payment.svc.cluster.local:8099/kill-payment
  TRUST_PROXY: "true"
  BASELINE_RPS: "25"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-config
  namespace: lab-payment
data:
  REDIS_URL: redis://redis.lab.svc.cluster.local:6379
  SITE_ORIGIN: https://REPLACE_HOST
  CHAOS_ENABLED: "true"
  CHAOS_ADAPTER: kubernetes
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lab.svc.cluster.local:4318
  POD_KILL_PROXY_URL: http://pod-kill-proxy.lab-payment.svc.cluster.local:8099/kill-payment
  TRUST_PROXY: "true"
