---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lab
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products(id uuid PRIMARY KEY,name text NOT NULL,price integer NOT NULL CHECK(price>0),icon text NOT NULL);
    CREATE TABLE IF NOT EXISTS orders(id uuid PRIMARY KEY,idempotency_key uuid UNIQUE NOT NULL,cart_id uuid NOT NULL,amount integer NOT NULL,status text NOT NULL CHECK(status IN ('processing','queued','confirmed','failed')),attempts integer NOT NULL DEFAULT 0,trace_context jsonb NOT NULL DEFAULT '{}',created_at timestamptz NOT NULL DEFAULT now(),updated_at timestamptz NOT NULL DEFAULT now());
    CREATE INDEX IF NOT EXISTS orders_pending ON orders(updated_at) WHERE status IN ('queued','processing');
    CREATE TABLE IF NOT EXISTS payments(idempotency_key uuid PRIMARY KEY,order_id uuid NOT NULL,amount integer NOT NULL,result jsonb NOT NULL,created_at timestamptz NOT NULL DEFAULT now());
    CREATE TABLE IF NOT EXISTS recoveries(id bigserial PRIMARY KEY,fault_id uuid UNIQUE NOT NULL,fault_type text NOT NULL,duration double precision NOT NULL,peak_p95 double precision NOT NULL,peak_error_rate double precision NOT NULL,created_at timestamptz NOT NULL DEFAULT now());
    INSERT INTO products(id,name,price,icon) SELECT ('00000000-0000-4000-8000-'||lpad(n::text,12,'0'))::uuid,name,price,icon FROM (VALUES
    (1,'Mechanical Keyboard',8900,'⌨'),(2,'Wireless Mouse',3900,'↖'),(3,'Studio Monitor',24900,'▣'),(4,'USB-C Hub',4900,'⊞'),(5,'Desk Light',3500,'◒'),(6,'Headphones',7900,'♫'),(7,'Webcam',5900,'◉'),(8,'Microphone',9900,'♩'),(9,'Laptop Stand',4500,'△'),(10,'Desk Mat',1900,'▱'),(11,'SSD Drive',8900,'▤'),(12,'USB Cable',1200,'∿'),(13,'Ergonomic Chair',29900,'♧'),(14,'Standing Desk',39900,'⊓'),(15,'Notebook',900,'▥'),(16,'Pen Set',1400,'✎'),(17,'Screen Bar',6900,'━'),(18,'Speakers',12900,'◖'),(19,'Trackpad',9900,'□'),(20,'Wrist Rest',2400,'▰'),(21,'Cable Clips',800,'⌁'),(22,'Desk Shelf',5900,'Π'),(23,'Charging Pad',2900,'◎'),(24,'Monitor Arm',7900,'⌐')) AS seed(n,name,price,icon) ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: lab
data:
  default.conf: >
    server {
      listen 8088;
      set_real_ip_from 10.42.0.0/16;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      root /usr/share/nginx/html;
      access_log off;
      error_log /dev/null crit;
      resolver 10.43.0.10 valid=5s ipv6=off;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
      location /api/ { set $backend http://gateway.lab.svc.cluster.local:8080; proxy_pass $backend; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
      location /v1/ { set $telemetry http://telemetry-api.lab.svc.cluster.local:8095; proxy_pass $telemetry; proxy_buffering off; proxy_read_timeout 3600s; }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab
data:
  prometheus.yml: >
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: services
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - lab
                - lab-payment
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: gateway|catalog|cart|payment|order-worker|chaos-controller|traffic-generator|telemetry-api
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: service
          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: Running
      - job_name: otel
        static_configs:
          - targets:
              - otel-metrics:8889
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: lab
data:
  otel.yaml: >
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: '0.0.0.0:4317'}
          http: {endpoint: '0.0.0.0:4318'}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 180, spike_limit_mib: 30}
      batch: {timeout: 1s, send_batch_size: 512}
    exporters:
      otlp/jaeger: {endpoint: 'jaeger-otlp:4317', tls: {insecure: true}}
      prometheus: {endpoint: '0.0.0.0:8889'}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/jaeger]}
        metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lab
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: ghcr.io/yehia249/resilience-lab-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: lab-config
            - secretRef:
                name: lab-secrets
          env:
            - name: SERVICE
              value: gateway
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lab
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
---
