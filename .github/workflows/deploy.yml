name: Deploy reviewed revision
on:
  workflow_dispatch:
    inputs:
      revision: {description: 'Full green CI commit SHA', required: true}
permissions: {contents: read, actions: read}
concurrency: {group: production-deploy, cancel-in-progress: false}
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.revision }}'}
      - name: Verify approved revision passed CI
        env: {GH_TOKEN: '${{ github.token }}', REVISION: '${{ inputs.revision }}'}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          gh run list --workflow ci.yml --commit "$REVISION" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - name: Prepare SSH
        env: {SSH_KEY: '${{ secrets.SSH_KEY }}', KNOWN_HOSTS: '${{ secrets.SSH_KNOWN_HOSTS }}'}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Apply and verify; rollback on smoke failure
        env: {LAB_SSH: '${{ vars.LAB_SSH }}', LAB_HOST: '${{ vars.LAB_HOST }}', REVISION: '${{ inputs.revision }}'}
        run: |
          [[ "$LAB_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          ssh "$LAB_SSH" "cd /opt/resilience-lab && git fetch origin && git checkout $REVISION && sudo LAB_HOST=$LAB_HOST LAB_IMAGE_TAG=$REVISION bash scripts/deploy.sh"
          if ! curl --fail --retry 20 --retry-delay 3 "https://$LAB_HOST/api/products"; then
            ssh "$LAB_SSH" 'cd /opt/resilience-lab && sudo bash scripts/rollback.sh'
            exit 1
          fi
