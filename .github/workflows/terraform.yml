name: Terraform review
on:
  pull_request: {paths: ['infra/terraform/**']}
  workflow_dispatch:
    inputs:
      action: {type: choice, options: [plan, apply], default: plan}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.13.5}
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform fmt -check && terraform -chdir=infra/terraform validate
  cloud-plan:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    environment: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Local credentials only
        run: |
          echo 'OCI keys stay on your workstation. Run scripts/provision.sh plan locally, review its saved plan, then approve scripts/provision.sh apply. No cloud credentials or state are uploaded to GitHub.'
          if [ '${{ inputs.action }}' = apply ]; then echo 'Remote apply disabled deliberately: first local resource-plan approval is required.'; exit 1; fi
